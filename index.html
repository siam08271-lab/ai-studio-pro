<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: linear-gradient(135deg,#667eea,#764ba2);
    }
    .container {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      padding-top:60px;
    }
    .card {
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      padding:25px;
      border-radius:20px;
      width:90%;
      max-width:600px;
      color:white;
      position:relative;
    }
    input, textarea {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }
    button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#6c63ff;
      color:white;
    }
    img {
      width:100%;
      margin-top:10px;
      border-radius:10px;
    }
    .menu {
      position:absolute;
      right:20px;
      top:20px;
    }
    .menu-box {
      display:none;
      position:absolute;
      right:0;
      top:40px;
      background:white;
      color:black;
      border-radius:10px;
      padding:10px;
    }
    .menu-box div {
      padding:8px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">
  <div class="card">
    <h2>🔐 Login / Register</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="register()">Create Account</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- MAIN -->
<div class="container" id="mainPage" style="display:none;">
  <div class="card">

    <div class="menu">
      <button onclick="toggleMenu()" style="width:auto;">⋮</button>

      <div id="menuBox" class="menu-box">
        <div onclick="showHistory()">📜 History</div>
        <div onclick="clearHistory()">🗑 Clear</div>
        <div onclick="logout()">🚪 Logout</div>
      </div>
    </div>

    <h2 id="welcomeText"></h2>
    <h3 id="coinText"></h3>

    <textarea id="prompt" placeholder="Type prompt..."></textarea>
    <button onclick="generate()">Generate</button>

    <div id="result"></div>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
  authDomain: "free-ai-33698.firebaseapp.com",
  projectId: "free-ai-33698",
  storageBucket: "free-ai-33698.firebasestorage.app",
  messagingSenderId: "897121643606",
  appId: "1:897121643606:web:7c21b45297758aa0df5ff7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let coins = 0;
let userId = null;

await setPersistence(auth, browserLocalPersistence);

// REGISTER
window.register = async () => {
  try {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
    alert("Account created!");
  } catch (e) {
    alert(e.message);
  }
};

// LOGIN
window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
  } catch (e) {
    alert(e.message);
  }
};

// LOGOUT
window.logout = () => signOut(auth);

// USER DATA
async function loadUser(user){
  userId = user.uid;

  const ref = doc(db,"users",userId);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{coins:10});
    coins = 10;
  } else {
    coins = snap.data().coins;
  }

  coinText.innerText = "Coins: " + coins;
}

// GENERATE
window.generate = async () => {

  if(coins <= 0){
    alert("No coins left!");
    return;
  }

  const prompt = document.getElementById("prompt").value;

  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

  saveHistory(url);

  result.innerHTML += `
    <div style="position:relative;">
      <img src="${url}">
      <div style="position:absolute;bottom:10px;right:10px;display:flex;gap:10px;">
        <a href="${url}" download target="_blank"
        style="background:#000000aa;padding:8px;border-radius:50%;">⬇️</a>

        <button onclick="shareImage('${url}')"
        style="background:#000000aa;padding:8px;border:none;border-radius:50%;color:white;">📤</button>
      </div>
    </div>
  `;

  coins--;

  await updateDoc(doc(db,"users",userId),{
    coins: coins
  });

  coinText.innerText = "Coins: " + coins;
};

// SHARE
window.shareImage = (url) => {
  if(navigator.share){
    navigator.share({ title:"AI Image", url });
  } else {
    alert("Share not supported");
  }
};

// MENU
window.toggleMenu = () => {
  menuBox.style.display = menuBox.style.display === "block" ? "none" : "block";
};

// HISTORY
function saveHistory(url){
  let list = JSON.parse(localStorage.getItem("history") || "[]");
  list.unshift(url);
  localStorage.setItem("history", JSON.stringify(list));
}

window.showHistory = () => {
  let list = JSON.parse(localStorage.getItem("history") || "[]");

  result.innerHTML = "";

  list.forEach(url => {
    result.innerHTML += `<img src="${url}">`;
  });
};

window.clearHistory = () => {
  localStorage.removeItem("history");
  result.innerHTML = "";
};

// AUTH STATE
onAuthStateChanged(auth, async (user)=>{

  if(user){
    loginPage.style.display="none";
    mainPage.style.display="flex";

    welcomeText.innerText = "Welcome " + user.email;

    await loadUser(user);
  } else {
    loginPage.style.display="flex";
    mainPage.style.display="none";
  }

});

</script>

</body>
</html>
