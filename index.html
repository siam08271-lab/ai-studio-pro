<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 80px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .secondary {
      background: #eee;
      color: #333;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="container" id="loginPage">
    <div class="card">
      <h2>🔐 Login</h2>

      <button onclick="googleLogin()">Login with Google</button>

      <p>or</p>

      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <button onclick="emailLogin()">Login with Email</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="container" id="mainPage" style="display:none;">
    <div class="card">

      <h2 id="welcomeText">Welcome 🎉</h2>
      <img id="profilePic" width="80" style="display:none;"><br><br>

      <button onclick="showImageGen()">🎨 Generate Image</button>
      <button onclick="showVideoGen()">🎬 Generate Video</button>

      <div id="toolArea"></div>

      <button class="secondary" onclick="logout()">Logout</button>

    </div>
  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect,
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
      authDomain: "free-ai-33698.firebaseapp.com",
      projectId: "free-ai-33698",
      storageBucket: "free-ai-33698.firebasestorage.app",
      messagingSenderId: "897121643606",
      appId: "1:897121643606:web:7c21b45297758aa0df5ff7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // LOGIN
    window.googleLogin = function() {
      signInWithRedirect(auth, provider);
    };

    window.emailLogin = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch(err => alert(err.message));
    };

    window.logout = function() {
      signOut(auth);
    };

    // IMAGE TOOL
    window.showImageGen = function() {
      document.getElementById("toolArea").innerHTML = `
        <h3>🎨 Image Generator</h3>
        <input id="imgPrompt" placeholder="Enter prompt"><br>
        <button onclick="generateImage()">Generate</button>
        <div id="imgResult"></div>
      `;
    };

    window.generateImage = function() {
      const prompt = document.getElementById("imgPrompt").value;
      const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

      document.getElementById("imgResult").innerHTML = `
        <p>⏳ Generating...</p>
        <img src="${url}" width="100%"><br><br>
        <button onclick="downloadImage('${url}')">⬇️ Download</button>
      `;
    };

    window.downloadImage = async function(url) {
      const res = await fetch(url);
      const blob = await res.blob();

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ai-image.png";
      a.click();
    };

    // VIDEO TOOL (SAFE VERSION)
    window.showVideoGen = function() {
      document.getElementById("toolArea").innerHTML = `
        <h3>🎬 Video Generator</h3>
        <p>🚧 Coming Soon...</p>
      `;
    };

    // AUTH STATE
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "flex";

        document.getElementById("welcomeText").innerText = "Welcome " + (user.displayName || "User");

        if (user.photoURL) {
          const img = document.getElementById("profilePic");
          img.src = user.photoURL;
          img.style.display = "block";
        }

      } else {
        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("mainPage").style.display = "none";
      }
    });

  </script>

</body>
</html>
