<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #333;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 60px;
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #ffffff33;
    }

    img {
      border-radius: 50%;
    }

    /* 🔥 Loader */
    .loader {
      border: 4px solid #ffffff44;
      border-top: 4px solid white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>

<div class="container" id="loginPage">
  <div class="card">
    <h2>🚀 AI Studio Pro</h2>

    <button onclick="googleLogin()">Continue with Google</button>

    <p>or</p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Create Account</button>
  </div>
</div>

<div class="container" id="mainPage" style="display:none;">
  <div class="card">

    <h2 id="welcomeText">Welcome</h2>
    <img id="profilePic" width="80" style="display:none;"><br><br>

    <button onclick="showImageGen()">🎨 Generate Image</button>
    <button onclick="showVideo()">🎬 Generate Video</button>

    <div id="toolArea"></div>

    <button class="secondary" onclick="logout()">Logout</button>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithRedirect,
  GoogleAuthProvider,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
  authDomain: "free-ai-33698.firebaseapp.com",
  projectId: "free-ai-33698",
  storageBucket: "free-ai-33698.firebasestorage.app",
  messagingSenderId: "897121643606",
  appId: "1:897121643606:web:7c21b45297758aa0df5ff7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// 🔥 LIMIT SYSTEM
let limit = 10;
let used = 0;

// 🔐 Google Login
window.googleLogin = function() {
  signInWithRedirect(auth, provider);
};

// 🔐 Email Login
window.login = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .catch(err => alert(err.message));
};

// 🔐 Signup
window.signup = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => alert("Account Created ✅"))
    .catch(err => alert(err.message));
};

// 🚪 Logout
window.logout = function() {
  signOut(auth);
};

// 🎨 Image Tool
window.showImageGen = function() {
  document.getElementById("toolArea").innerHTML = `
    <h3>🎨 Image Generator</h3>
    <p id="counter">Used: ${used} / ${limit}</p>
    <input id="prompt" placeholder="Enter prompt">
    <button onclick="generate()">Generate</button>
    <div id="result"></div>
  `;
};

window.generate = function() {

  if (used >= limit) {
    document.getElementById("result").innerHTML =
      "<p style='color:red;'>🚫 Daily limit reached</p>";
    return;
  }

  const prompt = document.getElementById("prompt").value;
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);

  document.getElementById("result").innerHTML = `
    <div class="loader"></div>
    <p>Generating...</p>
  `;

  setTimeout(() => {
    used++;

    document.getElementById("counter").innerText = `Used: ${used} / ${limit}`;

    document.getElementById("result").innerHTML = `
      <img src="${url}" width="100%"><br><br>
      <button onclick="download('${url}')">⬇️ Download</button>
    `;
  }, 1500);
};

window.download = async function(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "image.png";
  a.click();
};

// 🎬 Video
window.showVideo = function() {
  document.getElementById("toolArea").innerHTML = `
    <h3>🎬 Video Generator</h3>
    <p>🚧 Coming Soon (Premium Feature)</p>
  `;
};

// 👤 Auth
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("mainPage").style.display = "flex";

    document.getElementById("welcomeText").innerText =
      "Welcome " + (user.displayName || user.email);

    if (user.photoURL) {
      const img = document.getElementById("profilePic");
      img.src = user.photoURL;
      img.style.display = "block";
    }

  } else {
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("mainPage").style.display = "none";
  }
});

</script>

</body>
</html>
