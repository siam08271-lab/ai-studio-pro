<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>
</head>

<body>

  <!-- 🔹 Login Page -->
  <div id="loginPage">
    <h2>Login</h2>

    <button onclick="googleLogin()">Login with Google</button>

    <br><br>

    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="emailLogin()">Login with Email</button>
  </div>

  <!-- 🔹 Main Page -->
  <div id="mainPage" style="display:none;">
    <h2>Welcome User 🎉</h2>
    <button onclick="logout()">Logout</button>
  </div>


  <!-- 🔥 Firebase + JS -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 🔥 তোমার Firebase config (তুমি যেটা দিয়েছিলে সেটাই বসালাম)
    const firebaseConfig = {
      apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
      authDomain: "free-ai-33698.firebaseapp.com",
      projectId: "free-ai-33698",
      storageBucket: "free-ai-33698.firebasestorage.app",
      messagingSenderId: "897121643606",
      appId: "1:897121643606:web:7c21b45297758aa0df5ff7",
      measurementId: "G-EPHYJLGYRC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    const provider = new GoogleAuthProvider();

    // ✅ Google Login
    window.googleLogin = function() {
      signInWithPopup(auth, provider)
        .catch(err => alert(err.message));
    };

    // ✅ Email Login
    window.emailLogin = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch(err => alert(err.message));
    };

    // ✅ Logout
    window.logout = function() {
      signOut(auth);
    };

    // 🔥 MAIN FIX (login loop solve)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";
      } else {
        document.getElementById("loginPage").style.display = "block";
        document.getElementById("mainPage").style.display = "none";
      }
    });

  </script>

</body>
</html>
