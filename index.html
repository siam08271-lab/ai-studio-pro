<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: linear-gradient(135deg,#667eea,#764ba2);
    }
    .container {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      padding-top:60px;
    }
    .card {
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      padding:25px;
      border-radius:20px;
      width:90%;
      max-width:600px;
      color:white;
    }
    input,textarea {
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:10px;
      border:none;
    }
    button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#6c63ff;
      color:white;
    }
    .secondary { background:#ffffff33; }
    .section {
      margin-top:20px;
      padding:15px;
      background:rgba(255,255,255,0.1);
      border-radius:15px;
    }
    img { width:100%; margin-top:10px; border-radius:10px; }
    #menu { display:none; background:#000000cc; padding:10px; border-radius:10px; }

    #loading {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:#000;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      font-size:20px;
    }
  </style>
</head>

<body>

<div id="loading">Loading...</div>

<div class="container" id="loginPage">
  <div class="card">
    <h2>🚀 AI Studio Pro</h2>
    <button onclick="googleLogin()">Continue with Google</button>
    <p>or</p>
    <input id="email" placeholder="Email">
    <input id="password" type="password">
    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Create Account</button>
  </div>
</div>

<div class="container" id="mainPage" style="display:none;">
  <div class="card">

    <div style="display:flex;justify-content:space-between;">
      <h2 id="welcomeText"></h2>
      <button onclick="toggleMenu()" style="width:auto;">⋮</button>
    </div>

    <div id="menu">
      <button onclick="showCoins()">💰 Coins</button>
      <button onclick="showImageGen()">🎨 Image Generator</button>
      <button onclick="showHistory()">🖼 History</button>
      <button onclick="logout()">🚪 Logout</button>
    </div>

    <div class="section">
      <button onclick="showImageGen()">🎨 Image Generator</button>
    </div>

    <div id="toolArea"></div>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore, doc, getDoc, setDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
  authDomain: "free-ai-33698.firebaseapp.com",
  projectId: "free-ai-33698",
  storageBucket: "free-ai-33698.firebasestorage.app",
  messagingSenderId: "897121643606",
  appId: "1:897121643606:web:7c21b45297758aa0df5ff7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let coins = 0;
let userId = null;
let history = [];

getRedirectResult(auth);

window.login = () => {
  signInWithEmailAndPassword(auth,email.value,password.value)
  .catch(e=>alert(e.message));
};

window.signup = () => {
  createUserWithEmailAndPassword(auth,email.value,password.value)
  .catch(e=>alert(e.message));
};

window.googleLogin = () => {
  signInWithRedirect(auth,provider);
};

window.logout = () => signOut(auth);

window.toggleMenu = () => {
  menu.style.display = menu.style.display=="block"?"none":"block";
};

async function loadUser(user){
  userId = user.uid;
  const ref = doc(db,"users",userId);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{coins:10});
    coins = 10;
  } else {
    coins = snap.data().coins;
  }
}

window.showImageGen = () => {
  toolArea.innerHTML = `
    <div class="section">
      <h3 id="coinText">Coins: ${coins}</h3>
      <textarea id="prompt" placeholder="Type prompt..."></textarea>
      <button onclick="generate()">Generate</button>
      <div id="result"></div>
    </div>
  `;
};

window.generate = async () => {

  if(coins <= 0){
    alert("No coins left!");
    return;
  }

  const prompt = document.getElementById("prompt").value;
  const url = "https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt);

  document.getElementById("result").innerHTML += `
  <div style="margin-top:10px; position:relative;">
    
    <img src="${url}" style="width:100%; border-radius:10px;">
    
    <div style="
      position:absolute;
      bottom:10px;
      right:10px;
      display:flex;
      gap:8px;
    ">

      <!-- Download -->
      <a href="${url}" download target="_blank"
         style="
           background:#000000aa;
           padding:8px;
           border-radius:50%;
           text-decoration:none;
           font-size:16px;
         ">
         ⬇️
      </a>

      <!-- Share -->
      </button> onclick="shareImage('${url}')"
        style="
          background:#000000aa;
          padding:8px;
          border-radius:50%;
          border:none;
          color:white;
          font-size:16px;
        ">
        📤
      </

  history.push(url);

  coins--;

  await updateDoc(doc(db,"users",userId),{
    coins: coins
  });

  document.getElementById("coinText").innerText = "Coins: " + coins;
};
function shareImage(url) {
  if (navigator.share) {
    navigator.share({
      title: "AI Generated Image",
      url: url
    });
  } else {
    alert("Sharing not supported on this device");
  }
}
window.showHistory = () => {
  let html = "<h3>History</h3>";

  history.forEach(img=>{
    html += `<img src="${img}">`;
  });

  toolArea.innerHTML = html;
};

window.showCoins = () => {
  toolArea.innerHTML = `<h3>Coins: ${coins}</h3>`;
};

onAuthStateChanged(auth, async user=>{

  document.getElementById("loading").style.display = "none";

  if(user){
    loginPage.style.display="none";
    mainPage.style.display="flex";
    welcomeText.innerText="Welcome "+user.email;

    await loadUser(user);
  } else {
    loginPage.style.display="flex";
    mainPage.style.display="none";
  }
});

</script>

</body>
</html>
