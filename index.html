<!DOCTYPE html>
<html>
<head>
  <title>AI Studio Pro</title>
</head>

<body>

  <!-- 🔹 Login Page -->
  <div id="loginPage">
    <h2>Login</h2>

    <button onclick="googleLogin()">Login with Google</button>

    <br><br>

    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="emailLogin()">Login with Email</button>
  </div>

  <!-- 🔹 Main Page -->
  <div id="mainPage" style="display:none; text-align:center;">
    
    <h2 id="welcomeText">Welcome User 🎉</h2>

    <img id="profilePic" src="" width="100" style="border-radius:50%; display:none;"><br><br>

    <h3>🚀 AI Tools</h3>

    <button onclick="showImageGen()">🎨 Generate Image</button>
    <button onclick="showVideoGen()">🎬 Generate Video</button>

    <br><br>

    <div id="toolArea"></div>

    <br>

    <button onclick="logout()">Logout</button>
  </div>


  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4zL8cYV8A6SxEX6Fm9MKT_SNUyD-pilg",
      authDomain: "free-ai-33698.firebaseapp.com",
      projectId: "free-ai-33698",
      storageBucket: "free-ai-33698.firebasestorage.app",
      messagingSenderId: "897121643606",
      appId: "1:897121643606:web:7c21b45297758aa0df5ff7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    const provider = new GoogleAuthProvider();

    // Google Login
    window.googleLogin = function() {
      signInWithPopup(auth, provider)
        .catch(err => alert(err.message));
    };

    // Email Login
    window.emailLogin = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch(err => alert(err.message));
    };

    // Logout
    window.logout = function() {
      signOut(auth);
    };

    // 🔥 Tool UI Functions
    window.showImageGen = function() {
      document.getElementById("toolArea").innerHTML = `
        <h3>🎨 Image Generator</h3>
        <input id="imgPrompt" placeholder="Enter prompt"><br><br>
        <button onclick="generateImage()">Generate</button>
        <div id="imgResult"></div>
      `;
    };

    window.showVideoGen = function() {
      document.getElementById("toolArea").innerHTML = `
        <h3>🎬 Video Generator</h3>
        <input id="vidPrompt" placeholder="Enter prompt"><br><br>
        <button onclick="generateVideo()">Generate</button>
        <div id="vidResult"></div>
      `;
    };

    // Demo functions (next step এ real API বসাবো)
    window.generateImage = async function() {
  const prompt = document.getElementById("imgPrompt").value;

  document.getElementById("imgResult").innerHTML = "⏳ Generating Image...";

  try {
    const res = await fetch("https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt));
    
    const imgUrl = res.url;

    document.getElementById("imgResult").innerHTML = `
  <img src="${imgUrl}" width="300"><br><br>
  <button onclick="downloadImage('${imgUrl}')">⬇️ Download Image</button>
`;
  } catch (err) {
    document.getElementById("imgResult").innerHTML = "❌ Error generating image";
  }
};
    window.generateVideo = function() {
      document.getElementById("vidResult").innerHTML = "⏳ Generating Video...";
    };
window.downloadImage = async function(url) {
  const res = await fetch(url);
  const blob = await res.blob();

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ai-image.png";
  a.click();
};
    // 🔥 User detect + UI update
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";

        const name = user.displayName || "User";
        document.getElementById("welcomeText").innerText = "Welcome " + name + " 🎉";

        if (user.photoURL) {
          const img = document.getElementById("profilePic");
          img.src = user.photoURL;
          img.style.display = "block";
        }

      } else {
        document.getElementById("loginPage").style.display = "block";
        document.getElementById("mainPage").style.display = "none";
      }
    });

  </script>

</body>
</html>
